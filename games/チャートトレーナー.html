<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>チャートトレーナー | Magis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Noto Sans JP',sans-serif;
    background:linear-gradient(135deg,#0f2d1e,#2abfa0);
    color:#fff;
    min-height:100vh;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    padding:20px;text-align:center;
  }
  .emoji{font-size:5rem;margin-bottom:1rem}
  h1{font-size:2rem;margin-bottom:.5rem;font-weight:900}
  .badge{display:inline-block;background:#2abfa0;padding:4px 12px;border-radius:20px;font-size:.8rem;margin-bottom:2rem}
  .status{font-size:1.1rem;opacity:.9;margin-bottom:2.5rem;line-height:1.8}
  .back{
    display:inline-block;color:#fff;text-decoration:none;
    padding:12px 28px;border:2px solid rgba(255,255,255,.5);
    border-radius:8px;transition:all .2s;font-weight:700;
  }
  .back:hover{background:#fff;color:#0f2d1e;border-color:#fff}
</style>
</head>
<body>
  <div class="emoji">📈</div>
  <h1>チャートトレーナー</h1>
  <span class="badge">GAME</span>
  <p class="status">🚧 ただいま準備中です<br>もうしばらくお待ちください</p>
  <a class="back" href="../index.html">← トップに戻る</a>
</body>
</html>
