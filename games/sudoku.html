<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SUDOKU — ナンプレ</title>

<!-- Fonts: Premium テーマのスタック（Fraunces 斜体 + Inter） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="sudoku.css">
</head>
<body>

<!-- Brand -->
<div class="brand" id="brand-block">
  <h1 class="title">SUDOKU</h1>
  <p class="subtitle">Number Placement Puzzle</p>
  <span class="brand-rule"></span>
</div>

<!-- Difficulty -->
<div id="difficulty-screen">
  <p class="diff-label">Select Difficulty</p>

  <button class="diff-btn" onclick="startGame('easy')">
    <span>
      <span class="dn">EASY</span>
      <span class="dd" style="display:block;margin-top:2px;">易しい・空きマス少なめ</span>
    </span>
    <span class="dr" id="diff-meta-easy"><b>--:--</b><span>0回クリア</span></span>
  </button>

  <button class="diff-btn" onclick="startGame('normal')">
    <span>
      <span class="dn">NORMAL</span>
      <span class="dd" style="display:block;margin-top:2px;">普通・バランス型</span>
    </span>
    <span class="dr" id="diff-meta-normal"><b>--:--</b><span>0回クリア</span></span>
  </button>

  <button class="diff-btn" onclick="startGame('hard')">
    <span>
      <span class="dn">HARD</span>
      <span class="dd" style="display:block;margin-top:2px;">難しい・上級テクニック必要</span>
    </span>
    <span class="dr" id="diff-meta-hard"><b>--:--</b><span>0回クリア</span></span>
  </button>

  <div class="diff-screen-foot">
    <button class="foot-btn" onclick="openStats()">統計</button>
    <button class="foot-btn" onclick="openSettings()">設定</button>
  </div>
</div>

<!-- Game -->
<div id="game-screen">
  <div class="game-header">
    <div class="diff-badge" id="diff-badge">EASY</div>
    <div class="timer" id="timer">0:00</div>
    <div class="header-right">
      <div class="mistake-counter" title="ミス回数">
        <div class="mistake-dot" id="md1"></div>
        <div class="mistake-dot" id="md2"></div>
        <div class="mistake-dot" id="md3"></div>
        <span id="mc-count" style="margin-left:2px;">0/3</span>
      </div>
      <button class="icon-btn" onclick="openSettings()" title="設定">⚙</button>
    </div>
  </div>

  <div class="best-strip">
    <span>BEST <b id="best-time">--:--</b></span>
    <span class="bs-trail" id="best-trail">—</span>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div id="multi-select-bar">
    <div class="multi-bar-label">
      <span>✏</span> 複数選択中
      <span class="multi-bar-count" id="multi-count">0</span>マス
    </div>
    <button class="btn-multi-cancel" onclick="exitMultiSelect()">✕ 解除</button>
  </div>

  <div class="controls">
    <button class="ctrl-btn" onclick="doUndo()"><span class="ci">↩</span>もどす</button>
    <button class="ctrl-btn" id="memo-btn" onclick="toggleMemo()"><span class="ci">✏</span>メモ</button>
    <button class="ctrl-btn" onclick="clearCell()"><span class="ci">✕</span>けす</button>
    <button class="ctrl-btn" onclick="useHint()"><span class="ci">💡</span>ヒント</button>
    <button class="ctrl-btn" id="save-btn" onclick="exportBoard()"><span class="ci">📋</span>保存</button>
    <button class="ctrl-btn" onclick="resetGame()"><span class="ci">⟳</span>やめる</button>
  </div>

  <div class="numpad" id="numpad">
    <button class="num-btn" onclick="inputNum(1)">1<span class="num-remain" id="remain-1"></span></button>
    <button class="num-btn" onclick="inputNum(2)">2<span class="num-remain" id="remain-2"></span></button>
    <button class="num-btn" onclick="inputNum(3)">3<span class="num-remain" id="remain-3"></span></button>
    <button class="num-btn" onclick="inputNum(4)">4<span class="num-remain" id="remain-4"></span></button>
    <button class="num-btn" onclick="inputNum(5)">5<span class="num-remain" id="remain-5"></span></button>
    <button class="num-btn" onclick="inputNum(6)">6<span class="num-remain" id="remain-6"></span></button>
    <button class="num-btn" onclick="inputNum(7)">7<span class="num-remain" id="remain-7"></span></button>
    <button class="num-btn" onclick="inputNum(8)">8<span class="num-remain" id="remain-8"></span></button>
    <button class="num-btn" onclick="inputNum(9)">9<span class="num-remain" id="remain-9"></span></button>
  </div>
</div>

<!-- Result (game over) -->
<div id="result-screen">
  <div class="result-title" id="result-title">COMPLETE</div>
  <div class="result-grid">
    <div class="result-card"><div class="rc-num" id="r-time">-</div><div class="rc-label">タイム</div></div>
    <div class="result-card"><div class="rc-num" id="r-mistake">-</div><div class="rc-label">ミス</div></div>
  </div>
  <button class="btn-restart" onclick="resetGame()">PLAY AGAIN</button>
</div>

<!-- Settings modal -->
<div class="modal-backdrop" id="settings-modal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h2>設定</h2>
    <div class="modal-row">
      <span class="lbl">効果音</span>
      <button class="toggle on" id="toggle-sound" onclick="toggleSound()"></button>
    </div>
    <div class="modal-row">
      <span class="lbl">アニメーション</span>
      <button class="toggle on" id="toggle-anim" onclick="toggleAnim()"></button>
    </div>
    <button class="modal-close" onclick="closeSettings()">閉じる</button>
  </div>
</div>

<!-- Stats modal -->
<div class="modal-backdrop" id="stats-modal" onclick="if(event.target===this)closeStats()">
  <div class="modal">
    <h2>統計</h2>
    <div class="stats-grid">
      <div class="stat-cell" id="stat-easy">
        <div class="sc-diff">EASY</div>
        <div class="sc-num">0</div>
        <div class="sc-time">--:--</div>
        <div class="sc-foot">未挑戦</div>
      </div>
      <div class="stat-cell" id="stat-normal">
        <div class="sc-diff">NORMAL</div>
        <div class="sc-num">0</div>
        <div class="sc-time">--:--</div>
        <div class="sc-foot">未挑戦</div>
      </div>
      <div class="stat-cell" id="stat-hard">
        <div class="sc-diff">HARD</div>
        <div class="sc-num">0</div>
        <div class="sc-time">--:--</div>
        <div class="sc-foot">未挑戦</div>
      </div>
    </div>
    <p style="font-size:0.66rem;color:var(--muted);text-align:center;margin-top:10px;letter-spacing:0.06em;">
      上段=クリア数 / 中段=ベストタイム / 下段=挑戦数
    </p>
    <button class="modal-close" onclick="closeStats()">閉じる</button>
  </div>
</div>

<!-- Loader -->
<div id="loader">
  <div class="loader-mark">SUDOKU</div>
  <div class="loader-bar"></div>
</div>

<canvas id="confetti-canvas"></canvas>

<!-- HINT CHARACTER: swap .hc-placeholder with <img src="your-character.png" alt=""> when ready -->
<div id="hint-character" aria-hidden="true">
  <div class="hc-bubble">HINT!</div>
  <div class="hc-placeholder">💡</div>
</div>

<script src="sudoku.js"></script>

</body>
</html>
