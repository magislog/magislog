<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>将棋 β</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">

  <div id="files">
    <span>9</span><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
  </div>

  <div id="board"></div>

  <div id="ranks">
    <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>七</span><span>八</span><span>九</span>
  </div>

  <div id="gotePanel"></div>

  <div id="sentePanel"></div>

  <div id="keys">
    <div>←↑→↓ カーソル ／ Z 決定 ／ X 戻る</div>
    <div>最下段で ↓→ 持ち駒</div>
    <div>S メニュー（投了・タイトル）</div>
  </div>

  <div id="msg"></div>

  <div id="band" hidden></div>

  <div id="promo" hidden>
    <div class="ask">成りますか？</div>
    <div class="choices">
      <button type="button">成る</button>
      <button type="button">成らない</button>
    </div>
  </div>

  <div id="menu" hidden>
    <h2>メニュー</h2>
  </div>

  <div id="banner" hidden></div>

  <div id="title" hidden>
    <div class="ttl">将棋 β</div>
    <div class="opt opt-tutorial">チュートリアル</div>
    <div class="opt opt-free">フリープレイ</div>
    <div class="help">↑↓ で選び Z で決定</div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/rules.js"></script>
<script src="js/ai.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
