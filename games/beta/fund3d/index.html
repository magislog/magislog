<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投資ファンド β</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">

  <div id="top"></div>

  <div id="table"></div>

  <div id="nextBtn"></div>

  <div id="msg"></div>

  <div id="log"></div>

  <div id="news"></div>

  <div id="chart"></div>

  <div id="task"></div>

  <div id="keys">
    <div>↑↓ 銘柄を選ぶ（一番下の行は「次の日へ」）</div>
    <div>Z 選んだ銘柄の売買を開く ／ 一番下なら 次の日へ</div>
    <div>売買: ↑↓ 買う・売る・閉じる ／ ←→ か 1〜9 で割合 10〜90%</div>
    <div>Z 実行 ／ X 閉じる</div>
    <div>S メニュー（タイトルへ）</div>
    <div>右のチャートは選んだ銘柄の直近 20 日</div>
    <div>ニュースは次の「次の日へ」で効く</div>
  </div>

  <div id="band" hidden></div>

  <div id="menu" hidden>
    <h2>メニュー</h2>
  </div>

  <div id="dialog" hidden></div>

  <div id="result" hidden></div>

  <div id="title" hidden>
    <div class="ttl">投資ファンド β</div>
    <div class="sub">株を売買してファンドを増やす（30 日・1 日 1 ターン）</div>
    <div class="opt opt-tutorial">チュートリアル</div>
    <div class="opt opt-free">フリープレイ</div>
    <div class="help">↑↓ で選び Z で決定</div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/fund.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
