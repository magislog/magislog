<!doctype html>
<html lang="ja" class="cx-init">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Magisのキャラクターとイラスト。うい・かなめ・ひかり・るか・そら。">
  <title>イラスト — Magis</title>
  <link rel="stylesheet" href="/illustrations/style.css">
  <script src="/illustrations/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#chara">本文へ</a>
  <header class="cx-header">
    <a class="cx-brand" href="/" aria-label="Magis ホーム"><img src="/img/logo.jpg" alt=""><span>Magis</span></a>
    <p class="cx-title"><span>CHARACTER</span>イラスト</p>
    <nav class="cx-nav" aria-label="ページ移動"><a href="/">ホーム</a><a href="/investment-results/">投資の記録</a></nav>
  </header>
  <main id="chara" class="cx" data-tab="works">
    <div class="cx-bg" aria-hidden="true"><img alt="" src=""></div>
    <nav class="cx-faces" aria-label="キャラクター一覧"><ul id="cx-faces"></ul></nav>
    <figure class="cx-stage">
      <button class="cx-stage-open" type="button" aria-label="イラストを大きく表示">
        <img id="cx-stage-img" src="" alt="">
      </button>
      <figcaption id="cx-stage-cap" class="cx-stage-cap"></figcaption>
    </figure>
    <section class="cx-info" aria-labelledby="cx-name">
      <p class="cx-romaji" id="cx-romaji"></p>
      <h1 class="cx-name" id="cx-name">キャラクター</h1>
      <p class="cx-intro" id="cx-intro"></p>
      <div class="cx-tabs" role="tablist" aria-label="表示の切替">
        <button type="button" role="tab" id="tab-works" aria-controls="panel-works" aria-selected="true">イラスト</button>
        <button type="button" role="tab" id="tab-shorts" aria-controls="panel-shorts" aria-selected="false" tabindex="-1">短編</button>
        <button type="button" role="tab" id="tab-profile" aria-controls="panel-profile" aria-selected="false" tabindex="-1">プロフィール</button>
      </div>
      <div class="cx-panels">
        <div class="cx-panel" role="tabpanel" id="panel-works" aria-labelledby="tab-works">
          <ul class="cx-works" id="cx-works"></ul>
        </div>
        <div class="cx-panel" role="tabpanel" id="panel-shorts" aria-labelledby="tab-shorts" hidden>
          <p class="cx-empty" id="cx-shorts">公開中の短編はまだありません。イラストをご覧ください。</p>
        </div>
        <div class="cx-panel" role="tabpanel" id="panel-profile" aria-labelledby="tab-profile" hidden>
          <dl class="cx-profile" id="cx-profile"></dl>
        </div>
      </div>
    </section>
    <noscript><p class="cx-noscript">表示には JavaScript が必要です。<a href="/">ホームへ戻る</a></p></noscript>
  </main>
  <dialog class="lightbox" id="lightbox" aria-labelledby="lightbox-title">
    <button class="lightbox-close" type="button" aria-label="閉じる">×</button>
    <figure class="lightbox-figure">
      <img class="lightbox-image" src="" alt="">
      <figcaption><h2 id="lightbox-title"></h2></figcaption>
    </figure>
  </dialog>
</body>
</html>
