<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ee">
  <meta name="description" content="Magisのホームページで公開中のイラストを一覧できます。">
  <title>イラスト — Magis</title>
  <link rel="stylesheet" href="../home.css">
  <link rel="stylesheet" href="illustrations.css">
  <script src="illustrations.js" defer></script>
</head>
<body>
  <a class="skip" href="#artwork">本文へ</a>
  <header class="header">
    <a class="brand" href="../" aria-label="Magis ホーム"><img src="../img/logo.jpg" alt=""><span>Magis</span></a>
    <span class="header-note">ILLUSTRATION ARCHIVE</span>
    <nav aria-label="ページ移動"><a href="../">ホームへ戻る <span aria-hidden="true">↗</span></a></nav>
  </header>
  <main id="artwork" class="illustrations wrap">
    <div class="gallery-heading">
      <div><span class="eyebrow">ILLUSTRATIONS</span><h1>イラスト</h1></div>
      <p>ホームに掲載中のイラスト <span>06</span></p>
    </div>
    <div class="gallery-grid" aria-label="イラスト一覧">
      <button class="art-card art-card--hero" type="button" data-art="0" aria-label="拡大して表示：トップページのイラスト">
        <span class="art-image art-image--hero"><img src="../assets/hero-ui.png" alt="ノートパソコンで制作する、ういのイラスト" width="1216" height="832"></span>
        <span class="art-caption"><span class="art-source">HOME</span><span class="art-title">トップページ</span></span>
      </button>
      <button class="art-card" type="button" data-art="1" aria-label="拡大して表示：うい">
        <span class="art-image art-image--portrait"><img src="../img/members/ui.png" alt="ういの全身イラスト" width="832" height="1216" loading="lazy"></span>
        <span class="art-caption"><span class="art-source">MEMBER</span><span class="art-title">うい</span></span>
      </button>
      <button class="art-card" type="button" data-art="2" aria-label="拡大して表示：かなめ">
        <span class="art-image art-image--portrait"><img src="../img/members/kaname.png" alt="かなめの全身イラスト" width="832" height="1216" loading="lazy"></span>
        <span class="art-caption"><span class="art-source">MEMBER</span><span class="art-title">かなめ</span></span>
      </button>
      <button class="art-card" type="button" data-art="3" aria-label="拡大して表示：ひかり">
        <span class="art-image art-image--portrait"><img src="../img/members/hikari.png" alt="ひかりの全身イラスト" width="832" height="1216" loading="lazy"></span>
        <span class="art-caption"><span class="art-source">MEMBER</span><span class="art-title">ひかり</span></span>
      </button>
      <button class="art-card" type="button" data-art="4" aria-label="拡大して表示：るか">
        <span class="art-image art-image--portrait"><img src="../img/members/ruka.png" alt="るかの全身イラスト" width="832" height="1216" loading="lazy"></span>
        <span class="art-caption"><span class="art-source">MEMBER</span><span class="art-title">るか</span></span>
      </button>
      <button class="art-card" type="button" data-art="5" aria-label="拡大して表示：そら">
        <span class="art-image art-image--portrait"><img src="../img/members/sora.png" alt="そらの全身イラスト" width="832" height="1216" loading="lazy"></span>
        <span class="art-caption"><span class="art-source">MEMBER</span><span class="art-title">そら</span></span>
      </button>
    </div>
    <a class="gallery-home-link" href="../">Magis ホームへ戻る <span aria-hidden="true">↗</span></a>
  </main>
  <footer class="footer"><div class="wrap"><div class="footer-top"><a class="brand" href="../"><img src="../img/logo.jpg" alt=""><span>Magis</span></a><a class="text-link" href="#artwork">ページ先頭へ ↑</a></div><div class="footer-bottom"><span>THINK. MAKE. TRY.</span><nav aria-label="フッター"><a href="../#contents">制作物</a><a href="../investment-results/">投資の記録</a><a href="../#members">メンバー</a></nav><small>© 2026 Magis</small></div></div></footer>
  <dialog class="lightbox" id="lightbox" aria-labelledby="lightbox-title">
    <button class="lightbox-close" type="button" aria-label="閉じる">×</button>
    <button class="lightbox-nav lightbox-prev" type="button" aria-label="前の作品">‹</button>
    <figure class="lightbox-figure">
      <img class="lightbox-image" src="" alt="">
      <figcaption aria-live="polite"><span class="lightbox-count"></span><h2 id="lightbox-title"></h2><p class="lightbox-source"></p></figcaption>
    </figure>
    <button class="lightbox-nav lightbox-next" type="button" aria-label="次の作品">›</button>
  </dialog>
</body>
</html>
